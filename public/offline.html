<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Glint</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
        color: #fff;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        max-width: 30ch;
        color: #9a9aa3;
        line-height: 1.55;
      }
      button {
        margin-top: 10px;
        padding: 12px 22px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #000;
        font-weight: 650;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Glint can't reach the network right now. Your saved chats are still on this device and will sync when you're
        back.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
